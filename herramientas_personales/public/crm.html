<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mi panel — Consultora Prisma</title>
<style>
  :root {
    --bg: #0c0e12; --bg-soft: #12151b; --card: #171b22; --card-2: #1d222b; --border: #2a303a; --border-soft: #232830;
    --ink: #e9ecf1; --ink-soft: #99a3b0; --ink-faint: #6b7482; --primary: #6fa8d8; --primary-glow: rgba(111,168,216,.14);
    --gold: #e8bc6e; --error: #f0796c; --ok: #6fcf97;
    --reel: #6fa8d8; --carrusel: #e8d3ae; --historia: #8fb889; --quiz: #a594d6; --personal: #e39a7b; --otro: #99a3b0;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; font-size: 14px; }
  [hidden] { display: none !important; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }

  /* ---------- login ---------- */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login-box { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; }
  .marca { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 6px; }
  .login-box h1 { margin: 0 0 18px; font-size: 22px; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  aside { background: var(--bg-soft); border-right: 1px solid var(--border-soft); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
  .logo { font-size: 13px; letter-spacing: .12em; padding: 0 10px 18px; color: var(--ink-soft); }
  .logo b { color: var(--ink); }
  .nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 10px; border: 0; background: none; color: var(--ink-soft); text-align: left; font-weight: 500; }
  .nav-btn svg { width: 18px; height: 18px; flex: none; }
  .nav-btn:hover { background: var(--card); color: var(--ink); }
  .nav-btn.activo { background: var(--primary-glow); color: var(--primary); }
  .nav-sep { flex: 1; }
  .nav-link { font-size: 13px; color: var(--ink-faint); padding: 8px 12px; text-decoration: none; border-radius: 10px; }
  .nav-link:hover { color: var(--ink); background: var(--card); }

  main { padding: 26px 32px 60px; min-width: 0; }
  .barra { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .barra h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
  .barra .sub { color: var(--ink-faint); font-size: 13px; }
  .barra .espacio { flex: 1; }
  .btn { border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 8px 14px; font-weight: 500; }
  .btn:hover { border-color: var(--ink-faint); }
  .btn.primario { background: var(--primary); border-color: var(--primary); color: #0c1520; font-weight: 600; }
  .btn.peligro { color: var(--error); }
  .btn.chico { padding: 5px 10px; font-size: 12px; }
  .icon-btn { border: 1px solid var(--border); background: var(--card); width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }

  .card { background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 20px; }
  .card h2 { margin: 0 0 14px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .card h2 .contador { margin-left: auto; font-size: 12px; color: var(--ink-faint); font-weight: 500; }
  .vacio { color: var(--ink-faint); font-size: 13px; padding: 10px 0; }

  /* ---------- hoy ---------- */
  .grid-hoy { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--border-soft); border-radius: 14px; padding: 14px 16px; }
  .stat .n { font-size: 24px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  .progreso { height: 6px; background: var(--card-2); border-radius: 6px; overflow: hidden; margin: -4px 0 14px; }
  .progreso i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--ok)); border-radius: 6px; transition: width .3s; }

  .tarea { display: flex; gap: 12px; align-items: flex-start; padding: 10px 4px; border-top: 1px solid var(--border-soft); }
  .tarea:first-of-type { border-top: 0; }
  .tarea input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ok); flex: none; cursor: pointer; }
  .tarea .t { font-weight: 500; line-height: 1.35; }
  .tarea .d { color: var(--ink-faint); font-size: 12.5px; margin-top: 3px; line-height: 1.4; }
  .tarea.hecha .t { text-decoration: line-through; color: var(--ink-faint); }
  .tarea .hora { font-size: 12px; color: var(--gold); font-weight: 600; margin-right: 6px; }
  .tarea .borrar { margin-left: auto; opacity: 0; border: 0; background: none; color: var(--ink-faint); }
  .tarea:hover .borrar { opacity: 1; }
  .etq { display: inline-block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--card-2); color: var(--ink-soft); margin-left: 6px; vertical-align: 1px; }

  .pieza { border: 1px solid var(--border); border-left: 4px solid var(--c, var(--otro)); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; background: var(--bg-soft); cursor: pointer; }
  .pieza:hover { border-color: var(--ink-faint); border-left-color: var(--c); }
  .pieza .fmt { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--c); font-weight: 700; }
  .pieza .idea { font-weight: 600; font-size: 15px; margin: 6px 0 4px; line-height: 1.35; }
  .pieza .meta { color: var(--ink-faint); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; }
  .estado { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .estado::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); }
  .estado.Creado::before { background: var(--gold); }
  .estado.Publicado::before { background: var(--ok); }
  .alerta { color: var(--gold); }

  .evento { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--border-soft); }
  .evento:first-of-type { border-top: 0; }
  .evento .h { color: var(--personal); font-weight: 600; font-size: 12.5px; min-width: 42px; }

  /* ---------- semana ---------- */
  .semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
  .dia { background: var(--card); border: 1px solid var(--border-soft); border-radius: 14px; padding: 12px 10px; min-height: 340px; display: flex; flex-direction: column; gap: 8px; }
  .dia.hoy { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
  .dia-cab { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px 4px; }
  .dia-cab b { font-size: 13px; }
  .dia-cab span { color: var(--ink-faint); font-size: 12px; }
  .dia.hoy .dia-cab b { color: var(--primary); }
  .chip { border-radius: 9px; padding: 7px 9px; font-size: 12px; line-height: 1.3; cursor: pointer; background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
  .chip:hover { background: color-mix(in srgb, var(--c) 26%, transparent); }
  .chip .k { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--c); display: flex; justify-content: space-between; }
  .chip .x { margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .mini-tarea { display: flex; gap: 7px; align-items: flex-start; font-size: 12px; color: var(--ink-soft); line-height: 1.3; }
  .mini-tarea input { accent-color: var(--ok); margin: 1px 0 0; flex: none; }
  .mini-tarea.hecha span { text-decoration: line-through; color: var(--ink-faint); }
  .dia .agregar { margin-top: auto; border: 1px dashed var(--border); background: none; color: var(--ink-faint); border-radius: 9px; padding: 6px; font-size: 12px; }
  .dia .agregar:hover { color: var(--ink); border-color: var(--ink-faint); }
  .seccion-mini { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin-top: 4px; }

  /* ---------- mes ---------- */
  .mes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .mes .cab { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); padding: 4px 8px; }
  .celda { background: var(--card); border: 1px solid var(--border-soft); border-radius: 10px; min-height: 104px; padding: 7px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
  .celda:hover { border-color: var(--border); }
  .celda.fuera { opacity: .4; }
  .celda.hoy { border-color: var(--primary); }
  .celda .num { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .celda.hoy .num { color: var(--primary); }
  .pt { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 6px; border-radius: 5px; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--ink); }
  .celda .mas { font-size: 11px; color: var(--ink-faint); }

  /* ---------- subir ---------- */
  .drop { display: block; width: 100%; border: 2px dashed var(--border); border-radius: 20px; padding: 56px 24px; text-align: center; transition: .15s; cursor: pointer; background: var(--bg-soft); }
  .drop.sobre { border-color: var(--primary); background: var(--primary-glow); }
  .drop svg { width: 44px; height: 44px; color: var(--primary); }
  .drop h3 { margin: 12px 0 6px; font-size: 18px; }
  .drop p { margin: 0; color: var(--ink-faint); }
  .resultado { margin-top: 16px; }
  table.lista { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.lista td, table.lista th { text-align: left; padding: 9px 8px; border-top: 1px solid var(--border-soft); }
  table.lista th { color: var(--ink-faint); font-weight: 500; font-size: 12px; border-top: 0; }

  /* ---------- formularios y modal ---------- */
  .campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .campo label { font-size: 12px; color: var(--ink-soft); }
  input[type=text], input[type=password], input[type=date], input[type=time], textarea, select {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; width: 100%; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }
  textarea { min-height: 80px; resize: vertical; }
  .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-fondo { position: fixed; inset: 0; background: rgba(5, 7, 10, .66); display: grid; place-items: center; padding: 16px; z-index: 50; backdrop-filter: blur(4px); }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 480px; max-height: 92vh; overflow: auto; padding: 24px; }
  .modal.ancho { max-width: 780px; }
  .modal h3 { margin: 0 0 16px; font-size: 18px; }
  .modal .acciones { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .det { border-top: 1px solid var(--border-soft); padding: 14px 0; }
  .det h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); display: flex; align-items: center; gap: 8px; }
  .det h4 button { margin-left: auto; }
  .det .txt { white-space: pre-wrap; line-height: 1.5; font-size: 13.5px; color: var(--ink); word-break: break-word; }
  .det .txt.mono { font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 12.5px; background: var(--bg-soft); border: 1px solid var(--border-soft); border-radius: 10px; padding: 12px; max-height: 280px; overflow: auto; }
  .segmentos { display: inline-flex; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 3px; }
  .segmentos button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; color: var(--ink-soft); font-size: 13px; }
  .segmentos button.on { background: var(--card-2); color: var(--ink); }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--card-2); border: 1px solid var(--border); padding: 10px 18px; border-radius: 12px; z-index: 60; font-size: 13px; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
  .toast.error { border-color: var(--error); color: var(--error); }
  .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .msg.error { color: var(--error); }

  @media (max-width: 1100px) { .semana { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dia { min-height: 0; } .grid-hoy { grid-template-columns: 1fr; } }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 10px; gap: 2px; border-right: 0; border-bottom: 1px solid var(--border-soft); }
    .logo, .nav-sep, .nav-link { display: none; }
    .nav-btn { width: auto; padding: 8px 10px; font-size: 13px; }
    main { padding: 18px 16px 50px; }
    .semana { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .mes .celda { min-height: 64px; } .pt { display: none; }
    .fila { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="login" hidden>
  <div class="login-box">
    <p class="marca">Consultora Prisma</p>
    <h1>Mi panel</h1>
    <div class="campo"><input type="password" id="login-pass" placeholder="Contraseña" autocomplete="current-password"></div>
    <button class="btn primario" id="login-btn" style="width:100%">Entrar</button>
    <div class="msg error" id="login-msg"></div>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside>
    <div class="logo">CONSULTORA <b>PRISMA</b></div>
    <button class="nav-btn" data-vista="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
    <button class="nav-btn" data-vista="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4M9 10v11M15 10v11"/></svg>Semana</button>
    <button class="nav-btn" data-vista="mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>Mes</button>
    <button class="nav-btn" data-vista="subir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg>Subir plan</button>
    <button class="nav-btn" data-vista="recordatorios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Recordatorios</button>
    <button class="nav-btn" data-vista="flow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8l-6 4 6 4V8z"/></svg>Guía Flow</button>
    <div class="nav-sep"></div>
    <a class="nav-link" href="/analisis.html">Análisis de datos</a>
    <button class="nav-link" id="salir" style="border:0;background:none;text-align:left">Cerrar sesión</button>
  </aside>
  <main id="main"></main>
</div>

<div id="modal-raiz"></div>
<script src="/guia-flow.js"></script>

<script>
// ================= sesión (la misma que la página de Herramientas) =================
const LS_TOKEN = 'prisma_admin_token_local';
function token() {
  try { const r = JSON.parse(localStorage.getItem(LS_TOKEN) || 'null'); if (r && r.token && r.expiraEn > Date.now()) return r.token; } catch {}
  return null;
}
async function api(ruta, opciones = {}) {
  const headers = { Authorization: 'Bearer ' + token(), ...(opciones.body && !(opciones.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {}) };
  const res = await fetch('/api/crm' + ruta, { ...opciones, headers, body: opciones.body && !(opciones.body instanceof FormData) ? JSON.stringify(opciones.body) : opciones.body });
  if (res.status === 401) { mostrarLogin(); throw new Error('Sesión vencida'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Error del servidor');
  return data;
}
function mostrarLogin() { document.getElementById('app').hidden = true; document.getElementById('login').hidden = false; }
document.getElementById('login-btn').onclick = async () => {
  const msg = document.getElementById('login-msg'); msg.textContent = '';
  const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('login-pass').value }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { msg.textContent = d.error || 'No se pudo entrar.'; return; }
  localStorage.setItem(LS_TOKEN, JSON.stringify(d));
  iniciar();
};
document.getElementById('login-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('login-btn').click(); });
document.getElementById('salir').onclick = () => { localStorage.removeItem(LS_TOKEN); mostrarLogin(); };

// ================= utilidades =================
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DIAS = ['', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function sumar(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dsem(iso) { const g = new Date(iso + 'T12:00:00Z').getUTCDay(); return g === 0 ? 7 : g; }
function lunes(iso) { return sumar(iso, 1 - dsem(iso)); }
function corto(iso) { return `${+iso.slice(8, 10)} ${MESES[+iso.slice(5, 7) - 1].slice(0, 3)}`; }
function largo(iso) { return `${DIAS[dsem(iso)]} ${+iso.slice(8, 10)} de ${MESES[+iso.slice(5, 7) - 1]}`; }
function tipo(formato) { const f = (formato || '').toLowerCase(); return f.includes('quiz') ? 'quiz' : f.includes('reel') ? 'reel' : f.includes('carrusel') ? 'carrusel' : f.includes('historia') ? 'historia' : 'otro'; }
function toast(t, error) { const el = document.createElement('div'); el.className = 'toast' + (error ? ' error' : ''); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
async function copiar(t) { try { await navigator.clipboard.writeText(t); toast('Copiado'); } catch { toast('No se pudo copiar', true); } }

// ================= estado =================
const S = { vista: 'hoy', hoy: null, ancla: null, cache: {} };
function irA(vista) {
  S.vista = vista; location.hash = vista;
  document.querySelectorAll('.nav-btn').forEach((b) => b.classList.toggle('activo', b.dataset.vista === vista));
  render();
}
document.querySelectorAll('.nav-btn').forEach((b) => b.onclick = () => { S.ancla = S.hoy; irA(b.dataset.vista); });

async function cargar(desde, hasta) {
  const r = await api(`/agenda?desde=${desde}&hasta=${hasta}`);
  S.hoy = r.hoy;
  r.dias.forEach((d) => { S.cache[d.fecha] = d; });
  return r.dias;
}

async function render() {
  const main = $('#main');
  try {
    if (S.vista === 'hoy') return await vistaHoy(main);
    if (S.vista === 'semana') return await vistaSemana(main);
    if (S.vista === 'mes') return await vistaMes(main);
    if (S.vista === 'subir') return await vistaSubir(main);
    if (S.vista === 'recordatorios') return await vistaRecordatorios(main);
    if (S.vista === 'flow') return vistaFlow(main);
  } catch (e) { if (e.message !== 'Sesión vencida') main.innerHTML = `<div class="card vacio">No se pudo cargar: ${esc(e.message)}</div>`; }
}

// ================= piezas comunes =================
function htmlTarea(t, mini) {
  const id = esc(t.id);
  if (mini) return `<label class="mini-tarea ${t.hecha ? 'hecha' : ''}"><input type="checkbox" data-tarea="${id}" ${t.hecha ? 'checked' : ''}><span>${t.hora ? `<b style="color:var(--gold)">${esc(t.hora)}</b> ` : ''}${esc(t.titulo)}</span></label>`;
  const origen = t.origen === 'recurrente' ? 'recordatorio' : t.origen === 'plan' ? 'plan' : '';
  return `<div class="tarea ${t.hecha ? 'hecha' : ''}"><input type="checkbox" data-tarea="${id}" ${t.hecha ? 'checked' : ''}>
    <div><div class="t">${t.hora ? `<span class="hora">${esc(t.hora)}</span>` : ''}${esc(t.titulo)}${origen ? `<span class="etq">${origen}</span>` : ''}</div>${t.detalle ? `<div class="d">${esc(t.detalle)}</div>` : ''}</div>
    ${t.origen === 'manual' ? `<button class="borrar" data-borrar-tarea="${id}" title="Borrar">✕</button>` : ''}</div>`;
}
function htmlPieza(c) {
  return `<div class="pieza" style="--c:var(--${tipo(c.formato)})" data-pieza="${esc(c.id)}">
    <div class="fmt">${esc(c.formato)}</div><div class="idea">${esc(c.idea_ganadora || '(sin idea)')}</div>
    <div class="meta"><span class="estado ${esc(c.estado)}">${esc(c.estado)}</span><span>${esc(c.servicio)}</span>${c.puntaje ? `<span>${esc(c.puntaje)}</span>` : ''}${/^s[ií]/i.test(c.revision_contador) ? '<span class="alerta">Revisión del contador</span>' : ''}</div></div>`;
}
function htmlChip(c) {
  return `<div class="chip" style="--c:var(--${tipo(c.formato)})" data-pieza="${esc(c.id)}"><div class="k"><span>${esc(c.formato)}</span><span class="estado ${esc(c.estado)}"></span></div><div class="x">${esc(c.idea_ganadora)}</div></div>`;
}
function conectar(raiz) {
  raiz.querySelectorAll('[data-tarea]').forEach((el) => el.onchange = async () => {
    try { await api('/tareas/' + encodeURIComponent(el.dataset.tarea), { method: 'PATCH', body: { hecha: el.checked } }); if (raiz !== $('#main')) cerrar(); render(); } catch (e) { toast(e.message, true); }
  });
  raiz.querySelectorAll('[data-borrar-tarea]').forEach((el) => el.onclick = async () => { await api('/tareas/' + el.dataset.borrarTarea, { method: 'DELETE' }); render(); });
  raiz.querySelectorAll('[data-pieza]').forEach((el) => el.onclick = () => abrirPieza(el.dataset.pieza));
  raiz.querySelectorAll('[data-evento]').forEach((el) => el.onclick = () => abrirEvento(el.dataset.evento));
  raiz.querySelectorAll('[data-nuevo]').forEach((el) => el.onclick = (ev) => { ev.stopPropagation(); nuevoItem(el.dataset.fecha, el.dataset.nuevo); });
  raiz.querySelectorAll('[data-dia]').forEach((el) => el.onclick = () => { S.ancla = el.dataset.dia; abrirDia(el.dataset.dia); });
}
function buscarPieza(id) { for (const d of Object.values(S.cache)) { const c = d.contenidos.find((x) => x.id === id); if (c) return c; } return null; }
function buscarEvento(id) { for (const d of Object.values(S.cache)) { const e = d.eventos.find((x) => x.id === id); if (e) return e; } return null; }

async function vistaSemana(main) {

  const dias = await cargar(base, sumar(base, 6));
  main.innerHTML = `
  <div class="barra"><button class="icon-btn" id="prev">‹</button><button class="icon-btn" id="next">›</button>
    <div><h1>Semana del ${corto(base)}</h1><div class="sub">al ${corto(sumar(base, 6))}</div></div><div class="espacio"></div>

  <div class="semana">${dias.map((d) => `
    <div class="dia ${d.fecha === S.hoy ? 'hoy' : ''}">

      ${d.tareas.length ? `<div class="seccion-mini">Objetivos</div>${d.tareas.map((t) => htmlTarea(t, true)).join('')}` : ''}

  conectar(main);

// ================= MES =================
async function vistaMes(main) {
  const ref = S.ancla || S.hoy || new Date().toISOString().slice(0, 10);
  const primero = ref.slice(0, 8) + '01';
  const desde = lunes(primero);
  const hasta = sumar(desde, 41);
  const dias = await cargar(desde, hasta);
  const mes = primero.slice(0, 7);
  main.innerHTML = `
  <div class="barra"><button class="icon-btn" id="prev">‹</button><button class="icon-btn" id="next">›</button>
    <h1 style="text-transform:capitalize">${MESES[+mes.slice(5) - 1]} ${mes.slice(0, 4)}</h1><div class="espacio"></div>
    <button class="btn" id="hoy-btn">Hoy</button><button class="btn" data-nuevo="evento" data-fecha="${S.hoy}">+ Evento</button></div>
  <div class="mes">${DIAS.slice(1).map((d) => `<div class="cab">${d.slice(0, 3)}</div>`).join('')}
  ${dias.map((d) => {
    const items = [...d.contenidos.map((c) => `<div class="pt" style="--c:var(--${tipo(c.formato)})">${esc(c.formato)}</div>`), ...d.eventos.map((e) => `<div class="pt" style="--c:var(--personal)">${esc(e.titulo)}</div>`)];
    const pend = d.tareas.filter((t) => !t.hecha).length;
    return `<div class="celda ${d.fecha.slice(0, 7) !== mes ? 'fuera' : ''} ${d.fecha === S.hoy ? 'hoy' : ''}" data-dia="${d.fecha}"><div class="num">${+d.fecha.slice(8)}</div>${items.slice(0, 3).join('')}${items.length > 3 ? `<div class="mas">+${items.length - 3} más</div>` : ''}${pend ? `<div class="mas">${pend} objetivo${pend > 1 ? 's' : ''}</div>` : ''}</div>`;
  }).join('')}</div>`;
  const mover = (n) => { const d = new Date(primero + 'T12:00:00Z'); d.setUTCMonth(d.getUTCMonth() + n); S.ancla = d.toISOString().slice(0, 10); render(); };
  $('#prev').onclick = () => mover(-1); $('#next').onclick = () => mover(1); $('#hoy-btn').onclick = () => { S.ancla = S.hoy; render(); };
  conectar(main);
}

async function vistaSubir(main) {
  const r = await api('/resumen');
  main.innerHTML = `
  <div class="barra"><div><h1>Subir el plan semanal</h1><div class="sub">El Excel que arma Claude los sábados (instagram/calendario/Prisma_calendario_instagram.xlsx)</div></div></div>
  <label class="drop" id="drop"><input type="file" id="archivo" accept=".xlsx" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg>
    <h3>Arrastrá el Excel acá</h3><p>o hacé clic para elegirlo. Se cargan las piezas en el calendario y se crean los objetivos de cada día.</p></label>
  <div class="resultado" id="resultado"></div>
  <div class="card" style="margin-top:22px"><h2>Planes subidos</h2>
    ${r.semanas.length ? `<table class="lista"><tr><th>Semana</th><th>Archivo</th><th>Piezas</th><th>Subido</th></tr>${r.semanas.map((s) => `<tr><td>${corto(s.lunes)}</td><td>${esc(s.archivo)}</td><td>${s.piezas}</td><td>${new Date(s.subidoEn).toLocaleString('es-AR')}</td></tr>`).join('')}</table>` : '<div class="vacio">Todavía no subiste ningún plan.</div>'}
  </div>`;
  const drop = $('#drop'), input = $('#archivo');
  const subir = async (file) => {
    if (!file) return;
    const out = $('#resultado');
    if (!/\.xlsx$/i.test(file.name)) { out.innerHTML = '<div class="card" style="color:var(--error)">Tiene que ser el Excel del plan (.xlsx).</div>'; return; }
    out.innerHTML = '<div class="card vacio">Leyendo el Excel…</div>';
    // Se lee el archivo antes de mandarlo: si está abierto en Excel o solo en la nube de
    // OneDrive, el navegador no puede leerlo y el envío falla con un "Failed to fetch" sin explicación.
    let contenido;
    try { contenido = await file.arrayBuffer(); }
    catch { out.innerHTML = '<div class="card" style="color:var(--error)">No pude leer el archivo. Cerralo en Excel y, si está en OneDrive, marcalo como "Mantener siempre en este dispositivo". Después volvé a arrastrarlo.</div>'; return; }
    const fd = new FormData(); fd.append('archivo', new Blob([contenido], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), file.name);
    try {
      const x = await api('/plan', { method: 'POST', body: fd });
      out.innerHTML = `<div class="card"><h2 style="color:var(--ok)">Plan cargado · semana del ${corto(x.lunes)}</h2><p style="margin:0;color:var(--ink-soft)">${x.piezas} piezas (${x.nuevas} nuevas, ${x.actualizadas} actualizadas) · ${x.tareasNuevas} objetivos nuevos.</p><div class="acciones" style="justify-content:flex-start"><button class="btn primario" id="ver-semana">Ver la semana</button></div></div>`;
      $('#ver-semana').onclick = () => { S.ancla = x.lunes; irA('semana'); };
    } catch (e) {
      const msg = /failed to fetch|networkerror/i.test(e.message) ? 'Se cortó la conexión con el servidor al subir el archivo. Probá de nuevo; si sigue, avisame.' : e.message;
      out.innerHTML = `<div class="card" style="color:var(--error)">${esc(msg)}</div>`;
    }
    input.value = '';
  };
  input.onchange = () => subir(input.files[0]);
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('sobre'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('sobre'); }));
  drop.addEventListener('drop', (e) => subir(e.dataTransfer.files[0]));
}

// ================= modales =================
function modal(html, ancho) {
  const raiz = $('#modal-raiz');
  raiz.innerHTML = `<div class="modal-fondo"><div class="modal ${ancho ? 'ancho' : ''}">${html}</div></div>`;
  const fondo = raiz.firstElementChild;
  fondo.addEventListener('mousedown', (e) => { if (e.target === fondo) cerrar(); });
  return fondo.firstElementChild;
}
function cerrar() { $('#modal-raiz').innerHTML = ''; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrar(); });

    <div class="fmt" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--${tipo(c.formato)})">${esc(c.formato)} · ${largo(c.fecha)}</div>
    <h3 style="margin-top:6px">${esc(c.idea_ganadora)}</h3>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px">

      <input type="date" id="mover-fecha" value="${c.fecha}" style="width:auto">
      <span style="color:var(--ink-faint);font-size:12.5px">${esc(c.servicio)}${c.puntaje ? ' · ' + esc(c.puntaje) : ''}</span>

    ${bloque('Pedido para la IA · ' + esc(c.herramienta || ''), c.pedido_para_ia, { copiar: 'pedido_para_ia', mono: true })}
    ${bloque('Descripción', c.descripcion, { copiar: 'descripcion' })}
    ${bloque('Hashtags', c.hashtags, { copiar: 'hashtags' })}
    ${bloque('Stickers interactivos', c.stickers_interactivos)}
    ${bloque('Llamado a la acción', c.cta)}
    ${bloque('Link con UTM', c.link_utm, { copiar: 'link_utm' })}
    ${bloque('Texto alternativo', c.texto_alternativo, { copiar: 'texto_alternativo' })}
    <div class="acciones">${tipo(c.formato) === 'reel' ? '<button class="btn" id="ir-flow">¿Qué modelo uso en Flow?</button>' : ''}<button class="btn peligro" id="borrar-pieza">Quitar del calendario</button><button class="btn" id="cerrar-m">Cerrar</button></div>`, true);
  const irFlow = m.querySelector('#ir-flow'); if (irFlow) irFlow.onclick = () => { cerrar(); irA('flow'); };
  m.querySelectorAll('[data-copiar]').forEach((b) => b.onclick = () => copiar(c[b.dataset.copiar]));

  $('#mover-fecha', m).onchange = async (e) => { await api('/contenidos/' + c.id, { method: 'PATCH', body: { fecha: e.target.value } }); cerrar(); toast('Pieza movida'); render(); };
  $('#borrar-pieza', m).onclick = async () => { if (!confirm('¿Quitar esta pieza y sus objetivos del calendario?')) return; await api('/contenidos/' + c.id, { method: 'DELETE' }); cerrar(); render(); };

  const m = modal(`<h3>Evento personal</h3>
    <div class="fila"><div class="campo"><label>Fecha</label><input type="date" id="e-fecha" value="${e.fecha}"></div><div class="campo"><label>Hora</label><input type="time" id="e-hora" value="${esc(e.hora)}"></div></div>
    <div class="campo"><label>Título</label><input type="text" id="e-titulo" value="${esc(e.titulo)}"></div>
    <div class="campo"><label>Notas</label><textarea id="e-notas">${esc(e.notas)}</textarea></div>
    <div class="acciones"><button class="btn peligro" id="e-borrar">Borrar</button><button class="btn" id="e-cancelar">Cancelar</button><button class="btn primario" id="e-guardar">Guardar</button></div>`);
  $('#e-cancelar', m).onclick = cerrar;
  $('#e-borrar', m).onclick = async () => { await api('/eventos/' + e.id, { method: 'DELETE' }); cerrar(); render(); };
  $('#e-guardar', m).onclick = async () => { await api('/eventos/' + e.id, { method: 'PATCH', body: { fecha: $('#e-fecha', m).value, hora: $('#e-hora', m).value, titulo: $('#e-titulo', m).value, notas: $('#e-notas', m).value } }); cerrar(); render(); };
}

function abrirDia(fecha) {
  const d = S.cache[fecha]; if (!d) return;
  const m = modal(`<h3>${largo(fecha)}</h3>
    ${d.contenidos.map(htmlPieza).join('')}
    ${d.eventos.map((e) => `<div class="evento" data-evento="${esc(e.id)}" style="cursor:pointer"><span class="h">${esc(e.hora || '—')}</span><span>${esc(e.titulo)}</span></div>`).join('')}
    <div style="margin-top:8px">${d.tareas.map((t) => htmlTarea(t)).join('') || '<div class="vacio">Sin objetivos.</div>'}</div>
    <div class="acciones"><button class="btn" data-nuevo="evento" data-fecha="${fecha}">+ Evento</button><button class="btn primario" data-nuevo="tarea" data-fecha="${fecha}">+ Objetivo</button></div>`, true);
  conectar(m);
}

// ================= arranque =================
async function iniciar() {
  if (!token()) return mostrarLogin();
  try { S.hoy = (await api('/resumen')).hoy; S.ancla = S.hoy; } catch { return; }
  document.getElementById('login').hidden = true;
  document.getElementById('app').hidden = false;
  const v = location.hash.slice(1);
  irA(['hoy', 'semana', 'mes', 'subir', 'recordatorios', 'flow'].includes(v) ? v : 'hoy');
}
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== S.vista && ['hoy', 'semana', 'mes', 'subir', 'recordatorios', 'flow'].includes(v)) irA(v); });
iniciar();
</script>
