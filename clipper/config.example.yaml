      - {name: Westcol,    platform: kick,    channel: westcol,          keywords: []}
      # - {name: Goncho,     platform: kick,    channel: goncho,           keywords: []}
      - {name: zEkO,       platform: kick,    channel: zeko,             keywords: []}
