# ─────────────────────────────────────────────────────────────
#  CLIPPER — configuración
#  Editá este archivo y reiniciá:  sudo systemctl restart clipper
# ─────────────────────────────────────────────────────────────

data_dir: /opt/clipper/data
timezone: America/Buenos_Aires

discord:
  # Canal donde avisa "X salió en vivo / empezó a grabar"
  live_channel_id: 0
  # IDs de usuario de Discord que pueden aprobar (vacío = cualquiera del canal)
  approver_ids: []

monitor:
  poll_seconds: 120                 # cada cuánto revisa quién está en vivo
  max_concurrent_recordings: 5
  # Solo graba si el título o la categoría contienen alguna de estas palabras.
  # Dejalo vacío [] para grabar cualquier directo.
  require_keywords: ["gta", "grand theft auto"]
  quality: "720p60,720p,best"

recording:
  segment_seconds: 600              # bloques de 10 minutos, como en el video
  keep_segments_minutes: 45         # borra bloques crudos más viejos que esto

detection:
  pre_seconds: 20                   # cuánto antes del pico arranca el clip (35-45 s)
  post_seconds: 10                  # cuánto después del pico termina
  chat_delay_seconds: 6             # el chat reacciona unos segundos tarde
  min_gap_seconds: 120              # separación mínima entre dos clips del mismo stream
  max_clips_per_segment: 2
  threshold: 4.0                    # más alto = menos clips pero mejores
  min_words: 15                     # si el streamer casi no habla en el clip, se descarta solo
  weights: {audio: 1.0, chat: 1.3, emotes: 1.0}
  # Emotes / palabras que suman "hype" en el chat (minúsculas)
  emotes:
    laugh: ["kekw", "lul", "lmao", "lmfao", "omegalul", "icant", "jaja", "jsjs", "xd", "😂", "🤣", "💀", "kekl", "pepelaugh"]
    hype:  ["pog", "pogchamp", "poggers", "w", "wtf", "omg", "noo", "clip", "clipeen", "clipealo", "😱", "🔥", "gg"]

render:
  width: 720                        # 720x1280: entra en Discord (<10 MB) y TikTok/Reels lo aceptan bien
  height: 1280
  max_bitrate: 1100k
  whisper_model: base               # tiny | base | small (más grande = más lento)
  burn_subtitles: true
  fg_zoom: 1.25                     # zoom del juego en el centro (1.0 = se ve todo, más chico)
  discord_max_mb: 9.5               # si el clip pesa más, manda una vista previa liviana

publishing:
  min_gap_minutes: 30               # separa publicaciones de la misma cuenta
  graph_version: v23.0              # API de Meta
  youtube_category_id: "20"         # 20 = Gaming

# ─────────────────────────────────────────────────────────────
#  CUENTAS — una por idioma. Cada una tiene su canal de Discord
#  para aprobar, sus redes y su lista de streamers.
#  platform: twitch | kick | youtube     channel: nombre o @handle
#  keywords: [] en un streamer = grabar cualquier directo suyo (no solo GTA)
#
#  destinations: redes donde se publica al aprobar.
#    - instagram / facebook → automático (Meta)
#    - tiktok   → tiktok_mode: inbox  (borrador en tu bandeja, publicás con un toque)
#                              direct (solo cuando TikTok audite la app)
#    - youtube  → youtube_mode: manual (te llega el archivo) | api (privado hasta auditoría de Google)
#  Para pasar una red a Post for Me:  - {network: tiktok, provider: postforme}
# ─────────────────────────────────────────────────────────────
accounts:
  petclub:
    enabled: true
    language: es
    destinations: [tiktok]
    tiktok_mode: inbox
    youtube_mode: manual
    postforme_account_ids: {}
    caption_template: '{hook}
  
      {cta}
  
  
      {hashtags}'
    hashtags_juego: [gta6, gtarp, gta, gtavi, gtaroleplay]
    hashtags_humor_n: 2
    hashtags_pool: [humor, risas, momentosgraciosos, streamers, clipsdestream, comedia, parati]
    ctas: [Etiquetá al amigo que haría esto, '¿Vos qué hacías en su lugar?', No puede ser real, Seguinos para más momentos así, Esperá al final, Mandáselo a alguien que necesite reírse]
