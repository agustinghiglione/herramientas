filtro_humor:                       # filtro antes de mandar el clip a Discord
  risa: true                        # detector de risa local
  min_risa_segundos: 0.4            # menos risa que esto = descarte (salvo que el chat explote)
  chat_sin_risa: 6                  # si el chat tiene este pico, pasa aunque no haya risa
  gemini: true                      # juez de humor con Gemini (si hay GEMINI_API_KEY)
  nota_minima: 7                    # nota de 1 a 10 para llegar a Discord

# De dónde salen los clips: "kick_clips" = los más vistos que hizo el público en Kick; "streams" = grabar los streams
origen: kick_clips
kick_clips:
  cada_minutos: 20       # cada cuánto revisa los clips de cada streamer
  periodo: week          # day | week
  min_vistas: 50         # vistas mínimas del clip en Kick
  max_por_streamer: 2    # clips nuevos por streamer en cada vuelta
  min_segundos: 6
  max_segundos: 75
  min_words: 4
  categorias: [grand theft auto vi]  # ej. [grand theft auto] para quedarse solo con GTA; vacío = todas

# Holakase: plan de contenido (videos de jardinería con Google Flow)
holakase:
  activo: true
  primer_sabado: "2026-11-28"   # sábado por medio desde esta fecha se genera el plan de 2 semanas
  hora_plan: "09:00"
  hora_video: "10:00"
  creditos_dia: 50
  costo_toma: 10
  semanas_agenda: 26
