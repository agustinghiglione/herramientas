    language: es
    review_channel_id: 0
    destinations: [instagram, facebook, tiktok, youtube]
    tiktok_mode: inbox
    youtube_mode: manual
    postforme_account_ids: {}       # se usa recién cuando pagues Post for Me
    caption_template: "{hook}\n{cta}\n\n{hashtags}"
    hashtags_juego: [gta6, gtarp, gta, gtavi, gtaroleplay]   # se usan si Gemini no devuelve hashtags propios
    hashtags_humor_n: 2
    hashtags_pool: [humor, risas, momentosgraciosos, streamers, clipsdestream, comedia, parati]
    ctas: ["Etiquetá al amigo que haría esto", "¿Vos qué hacías en su lugar?", "No puede ser real", "Seguinos para más momentos así", "Esperá al final", "Mandáselo a alguien que necesite reírse"]
